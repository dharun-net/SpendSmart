<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendSmart AI | Team Zenova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d1f;--panel:#17142e;--line:#2b2750;--purple:#635bdb;--purple2:#8b83ff;--text:#ecebff;--muted:#9d9ac8;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#2a2470 0%,transparent 60%),var(--bg);color:var(--text);display:flex;justify-content:center}
.app{width:100%;max-width:860px;height:100%;display:flex;flex-direction:column;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:6px 4px 14px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple2));display:grid;place-items:center;font-size:20px}
header h1{font-size:19px;font-weight:700}
header p{font-size:12.5px;color:var(--muted)}
.back{margin-left:auto;color:var(--purple2);font-size:13px;text-decoration:none;font-weight:600}
.status{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pill{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.pill b{color:var(--text)}
.pill.ok b{color:var(--ok)}
.pill.warn b{color:var(--warn)}
.chat{flex:1;overflow-y:auto;scroll-behavior:smooth;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:84%;padding:12px 15px;border-radius:16px;font-size:14.5px;line-height:1.55;word-wrap:break-word}
.msg.ai{background:#211d45;border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.msg.user{background:linear-gradient(135deg,var(--purple),#7a72f0);border-top-right-radius:4px;align-self:flex-end;color:#fff}
.msg b{font-weight:700}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--purple2);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px}
.chip{flex:none;font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:8px 13px;border-radius:99px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--purple2);outline:none}
.row{display:flex;gap:10px;padding-top:8px}
.row input{flex:1;font:inherit;font-size:14.5px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row input:focus{outline:2px solid var(--purple2);border-color:transparent}
.send{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));border:0;border-radius:14px;padding:0 22px;cursor:pointer}
.note{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 0 2px}
details{margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;color:var(--purple2);font-weight:600}
details .f{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
details input,details select{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
details button{font:inherit;font-size:13px;color:#fff;background:var(--purple);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
details button.g{background:transparent;border:1px solid var(--line);color:var(--muted)}
@media(max-width:560px){.app{padding:10px}.msg{max-width:92%}}
@media(prefers-reduced-motion:reduce){.chat{scroll-behavior:auto}.typing span{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">✦</div>
    <div><h1>SpendSmart AI</h1><p>Your personal financial assistant</p></div>
    <a class="back" href="./index.html">← Back to dashboard</a>
  </header>

  <div class="status" id="status"></div>

  <details id="manual">
    <summary>Data not showing? Set your budget and expenses here</summary>
    <div class="f">
      <input id="mBudget" type="number" placeholder="Monthly budget (₹)">
      <button id="saveBudget">Save budget</button>
    </div>
    <div class="f">
      <input id="mDesc" type="text" placeholder="What for?">
      <input id="mAmt" type="number" placeholder="Amount (₹)">
      <select id="mCat"><option>Food</option><option>Transportation</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>Others</option></select>
      <button id="addExp">Add expense</button>
    </div>
    <div class="f"><button class="g" id="demoData">Load sample data</button><button class="g" id="clearManual">Clear manual data</button></div>
  </details>

  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="row" id="form">
    <input id="input" type="text" placeholder="Ask about your budget or spending..." autocomplete="off" aria-label="Message">
    <button class="send" type="submit">Send</button>
  </form>
  <p class="note">Smart Demo AI: rule-based financial logic running in your browser. Your data never leaves this device.</p>
</div>

<script>
/* =====================================================================
   SpendSmart AI  -  Smart Demo AI (rule-based, NOT a generative model)
   Part 1: reading data | Part 2: the "brain" | Part 3: the chat screen
   ===================================================================== */

/* ---------- PART 1: DATA ---------- */
var MANUAL_KEY = 'spendsmart_ai_manual';
var data = { expenses: [], budget: 0, source: 'none' };

function num(v){ var n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; }
function looksLikeExpense(o){ return o && typeof o === 'object' && !Array.isArray(o) && ('amount' in o || 'price' in o || 'cost' in o); }
function normalize(e){
  return { desc: e.description || e.desc || e.title || e.name || e.note || 'Expense',
           amount: num(e.amount != null ? e.amount : (e.price != null ? e.price : e.cost)),
           category: e.category || e.cat || 'Others', date: e.date || e.createdAt || e.time || '' };
}
function loadData(){
  var found = [], budget = 0, source = 'none', i, k, v;
  for (i = 0; i < localStorage.length; i++){
    k = localStorage.key(i);
    if (k === MANUAL_KEY) continue;
    try { v = JSON.parse(localStorage.getItem(k)); } catch(e){ continue; }
    if (Array.isArray(v) && v.length && looksLikeExpense(v[0])) { found = v.map(normalize); source = 'SpendSmart dashboard'; }
    else if (v && typeof v === 'object' && !Array.isArray(v)){
      ['expenses','transactions','items'].forEach(function(f){ if (Array.isArray(v[f]) && v[f].length && looksLikeExpense(v[f][0])) { found = v[f].map(normalize); source = 'SpendSmart dashboard'; } });
      ['budget','monthlyBudget','limit'].forEach(function(f){ if (v[f] != null && num(v[f]) > 0) budget = num(v[f]); });
    } else if (/budget|limit/i.test(k) && num(v) > 0) { budget = num(v); }
  }
  /* manual data fills any gap */
  var m = {}; try { m = JSON.parse(localStorage.getItem(MANUAL_KEY)) || {}; } catch(e){}
  if (!found.length && m.expenses && m.expenses.length){ found = m.expenses; source = 'manual entry'; }
  if (!budget && m.budget){ budget = m.budget; if (source === 'none') source = 'manual entry'; }
  data = { expenses: found, budget: budget, source: source };
}
function saveManual(fn){
  var m = {}; try { m = JSON.parse(localStorage.getItem(MANUAL_KEY)) || {}; } catch(e){}
  m.expenses = m.expenses || []; fn(m);
  localStorage.setItem(MANUAL_KEY, JSON.stringify(m)); refresh();
}
function thisMonth(list){
  var now = new Date();
  return list.filter(function(e){
    var d = new Date(e.date); if (isNaN(d)) return true;
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}
function stats(){
  var list = thisMonth(data.expenses), total = 0, cats = {};
  list.forEach(function(e){ total += e.amount; cats[e.category] = (cats[e.category] || 0) + e.amount; });
  var sorted = Object.keys(cats).map(function(c){ return [c, cats[c]]; }).sort(function(a,b){ return b[1]-a[1]; });
  return { list: list, total: total, cats: sorted, top: sorted[0], budget: data.budget, left: data.budget - total };
}
function inr(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }

/* ---------- PART 2: THE BRAIN ---------- */
var memory = { income: 0, waitingForIncome: false };

function extractAmount(t){
  t = t.toLowerCase().replace(/,/g,'');
  var m = t.match(/(\d+(?:\.\d+)?)\s*(k|thousand|lakh|lakhs|lac)?/);
  if (!m) return 0;
  var n = parseFloat(m[1]), u = m[2];
  if (u === 'k' || u === 'thousand') n *= 1000;
  if (u === 'lakh' || u === 'lakhs' || u === 'lac') n *= 100000;
  return n;
}
function has(t, words){ return words.some(function(w){ return t.indexOf(w) !== -1; }); }

function needData(){
  return "I can't see any expenses yet. Add some on the dashboard, or open **Data not showing?** above and add a few (or load sample data), then ask me again.";
}

function planBudget(income, t){
  var e = 50, w = 30, s = 20, note = '50/30/20 rule';
  if (has(t, ['rent','emi','loan','hostel','fees'])) { e = 60; w = 25; s = 15; note = 'adjusted to 60/25/15 because you have fixed commitments'; }
  else if (has(t, ['save more','aggressive','goal'])) { e = 50; w = 20; s = 30; note = 'adjusted to 50/20/30 to boost savings'; }
  var out = '**Smart budget for ' + inr(income) + '/month** (' + note + ')\n\n' +
    '• Needs (food, travel, education): **' + inr(income*e/100) + '** (' + e + '%)\n' +
    '• Wants (shopping, fun): **' + inr(income*w/100) + '** (' + w + '%)\n' +
    '• Savings: **' + inr(income*s/100) + '** (' + s + '%)\n\n' +
    'Weekly spending limit for wants: **' + inr(income*w/100/4) + '**.';
  var st = stats();
  if (st.total > 0) out += '\n\nYou have spent ' + inr(st.total) + ' so far this month. ' + (st.total > income*(e+w)/100 ? 'That is above this plan\'s spending limit, so time to trim.' : 'That fits inside this plan. Nice.');
  return out + '\n\nWant to see how to save a specific amount? Ask: "How can I save ₹2,000?"';
}

function analyze(){
  var st = stats(); if (!st.list.length) return needData();
  var out = '**Spending analysis (this month)**\n\n• Total expenses: **' + inr(st.total) + '** across ' + st.list.length + ' entries\n';
  if (st.budget){
    out += '• Monthly budget: **' + inr(st.budget) + '**\n• Remaining: **' + inr(st.left) + '**\n';
    out += st.left < 0 ? '• ⚠️ You are **over budget by ' + inr(-st.left) + '**.\n' : '• ✅ You are within budget (' + Math.round(st.total/st.budget*100) + '% used).\n';
  }
  out += '\n**By category**\n' + st.cats.map(function(c){ return '• ' + c[0] + ': ' + inr(c[1]) + ' (' + Math.round(c[1]/st.total*100) + '%)'; }).join('\n');
  out += '\n\nHighest spending: **' + st.top[0] + '** at ' + inr(st.top[1]) + '. ';
  var wants = st.cats.filter(function(c){ return ['Shopping','Entertainment','Others','Food'].indexOf(c[0]) > -1; });
  if (wants.length) out += 'Easiest place to cut: **' + wants[0][0] + '**.';
  return out;
}

function remaining(){
  var st = stats();
  if (!st.budget) return "I can't find a monthly budget. Set one on the dashboard (Edit budget) or in the **Data not showing?** box above.";
  var out = '**Budget remaining**\n\n' + inr(st.budget) + ' budget − ' + inr(st.total) + ' spent = **' + inr(st.left) + '**';
  if (st.left < 0) return out + '\n\n⚠️ You have gone over budget by ' + inr(-st.left) + '.';
  var day = new Date().getDate(), days = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  var daysLeft = Math.max(days - day + 1, 1);
  return out + '\n\nThat is about **' + inr(st.left/daysLeft) + ' per day** for the remaining ' + daysLeft + ' days of the month.';
}

function saveTarget(t){
  var target = extractAmount(t) || 2000, st = stats();
  if (!st.list.length) {
    return '**Saving ' + inr(target) + ' more next month**\n\n• Save ' + inr(target/4) + ' every week, or about ' + inr(target/30) + ' a day\n• Move it to savings on day 1, before you spend\n• Add your expenses so I can point at the exact categories to trim.';
  }
  var cut = {Shopping:.4, Entertainment:.4, Others:.3, Food:.2, Transportation:.1, Education:0};
  var plan = [], got = 0;
  st.cats.forEach(function(c){
    var r = cut[c[0]] != null ? cut[c[0]] : .2, amt = Math.min(c[1]*r, target - got);
    if (amt >= 50){ plan.push([c[0], amt, Math.round(r*100)]); got += amt; }
  });
  var out = '**How to save an extra ' + inr(target) + ' next month**\n\nBased on your spending of ' + inr(st.total) + ' this month:\n\n';
  out += plan.map(function(p){ return '• Cut **' + p[0] + '** by about ' + inr(p[1]) + ' (' + p[2] + '% less)'; }).join('\n');
  if (got < target - 1) out += '\n\nThat covers ' + inr(got) + '. For the remaining **' + inr(target-got) + '**, set aside ' + inr((target-got)/4) + ' each week.';
  else out += '\n\nThat adds up to **' + inr(got) + '**. ';
  out += '\n\nTip: set a weekly limit of ' + inr((st.total-got)/4) + ' to stay on track.';
  return out;
}

function tips(){
  var st = stats(), out = '**Smart saving tips**\n\n';
  if (st.top) out += '• Your biggest category is **' + st.top[0] + '** (' + inr(st.top[1]) + '). Set a cap for it first.\n';
  if (st.budget && st.total > st.budget*.8) out += '• You have used ' + Math.round(st.total/st.budget*100) + '% of your budget. Pause non-essential spending.\n';
  return out + '• Save a fixed 20% of any money you receive, on the same day\n• Set weekly limits instead of monthly ones\n• Write down small daily spends such as snacks and tea; they add up\n• Wait 24 hours before any non-essential purchase\n• Use student discounts and share subscriptions with friends';
}

/* The brain: pick a reply for a message.
   Later you can connect a real AI by setting AI_API_URL to your own backend URL
   (never put a secret key in this file). If it fails we fall back to the logic above. */
var AI_API_URL = '';
function ruleReply(raw){
  var t = raw.toLowerCase().trim();
  if (memory.waitingForIncome && extractAmount(t) > 0 && !has(t, ['analy','remaining','left'])){
    memory.waitingForIncome = false; memory.income = extractAmount(t); return planBudget(memory.income, t);
  }
  if (/^(hi|hello|hey|hii|good (morning|evening|afternoon))\b/.test(t)) return 'Hi! I am **SpendSmart AI**. I can plan a budget, analyze your spending, check what is left, and help you save more. What would you like to do?';
  if (has(t, ['thank'])) return 'Happy to help! Ask me anything else about your money.';
  if (has(t, ['analy','spending','spent','breakdown','overview'])) return analyze();
  if (has(t, ['remaining','left','how much budget','balance'])) return remaining();
  if (has(t, ['save','saving'])  && extractAmount(t) >= 100) return saveTarget(t);
  if (has(t, ['budget','plan','income','salary','pocket money','allowance']) && extractAmount(t) >= 100){ memory.income = extractAmount(t); return planBudget(memory.income, t); }
  if (has(t, ['budget','plan']) ){ memory.waitingForIncome = true; return 'Sure! What is your monthly income (or pocket money)? For example: "₹20,000".'; }
  if (has(t, ['save','saving','tip','reduce','cut','advice'])) return has(t, ['tip']) ? tips() : saveTarget(t);
  if (has(t, ['help','what can you do'])) return 'Try asking:\n• "My monthly income is ₹25,000. Create a budget."\n• "Analyze my spending."\n• "How can I save ₹2,000 next month?"\n• "How much budget is remaining?"\n• "Give me smart saving tips."';
  return "I did not quite get that. I can help with **budget plans**, **spending analysis**, **remaining budget** and **saving tips**. Try one of the buttons below.";
}
async function reply(text){
  if (AI_API_URL){
    try {
      var r = await fetch(AI_API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:text, summary:stats() }) });
      if (r.ok){ var j = await r.json(); if (j.reply) return j.reply; }
    } catch(e){ /* fall back to built-in logic */ }
  }
  return ruleReply(text);
}

/* ---------- PART 3: CHAT SCREEN ---------- */
var chat = document.getElementById('chat'), input = document.getElementById('input');
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
function add(text, who){
  var d = document.createElement('div'); d.className = 'msg ' + who; d.innerHTML = fmt(text);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
async function send(text){
  text = text.trim(); if (!text) return;
  loadData(); add(text, 'user'); input.value = '';
  var ty = document.createElement('div'); ty.className = 'msg ai typing'; ty.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(ty); chat.scrollTop = chat.scrollHeight;
  var ans = await reply(text);
  await new Promise(function(r){ setTimeout(r, 650); });
  ty.remove(); add(ans, 'ai');
}
function refresh(){
  loadData(); var st = stats(), el = document.getElementById('status');
  var found = data.expenses.length > 0;
  el.innerHTML = '<span class="pill ' + (found ? 'ok' : 'warn') + '">Expenses: <b>' + (found ? st.list.length + ' this month' : 'none found') + '</b></span>' +
    '<span class="pill ' + (data.budget ? 'ok' : 'warn') + '">Budget: <b>' + (data.budget ? inr(data.budget) : 'not found') + '</b></span>' +
    '<span class="pill">Source: <b>' + data.source + '</b></span>';
}
document.getElementById('form').addEventListener('submit', function(e){ e.preventDefault(); send(input.value); });
['Analyze my spending','Create a budget for ₹20,000','How can I save money?','How much budget is remaining?','Give me smart saving tips'].forEach(function(q){
  var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = q;
  b.addEventListener('click', function(){ send(q); }); document.getElementById('chips').appendChild(b);
});
document.getElementById('saveBudget').addEventListener('click', function(){
  var v = num(document.getElementById('mBudget').value); if (v > 0) saveManual(function(m){ m.budget = v; });
});
document.getElementById('addExp').addEventListener('click', function(){
  var a = num(document.getElementById('mAmt').value); if (a <= 0) return;
  saveManual(function(m){ m.expenses.push({ desc: document.getElementById('mDesc').value || 'Expense', amount: a, category: document.getElementById('mCat').value, date: new Date().toISOString() }); });
  document.getElementById('mAmt').value = ''; document.getElementById('mDesc').value = '';
});
document.getElementById('demoData').addEventListener('click', function(){
  var d = new Date().toISOString();
  saveManual(function(m){ m.budget = 10000; m.expenses = [
    {desc:'Canteen lunches',amount:1800,category:'Food',date:d},{desc:'Bus pass',amount:900,category:'Transportation',date:d},
    {desc:'Online course',amount:1200,category:'Education',date:d},{desc:'Clothes',amount:2600,category:'Shopping',date:d},
    {desc:'Movies and games',amount:1500,category:'Entertainment',date:d},{desc:'Misc',amount:600,category:'Others',date:d}]; });
});
document.getElementById('clearManual').addEventListener('click', function(){ localStorage.removeItem(MANUAL_KEY); refresh(); });

refresh();
add('Hi! I am **SpendSmart AI**, your personal financial assistant. ✦\nI can plan your budget, analyze your spending and help you save. Tap a question below or type your own.', 'ai');
</script>
</body>
</html>
